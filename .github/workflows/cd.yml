name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6

      - name: Build app with script
        run: ./scripts/buildprod.sh

      - name: GCP auth
        uses: google-github-actions/auth@v2
        with: 
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Submit build to Google Cloud Build
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-504607/notely-ar-repo/notely:latest

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-504607/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-504607 --max-instances=4
